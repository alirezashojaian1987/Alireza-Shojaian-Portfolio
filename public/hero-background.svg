<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Base gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111c2d"/>
    </linearGradient>

    <!-- Soft ambient glows (no hard circle edges, just light) -->
    <radialGradient id="glowPrimary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowHighlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b942" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette to keep edges readable for overlaid text -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0b1220" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.55"/>
    </radialGradient>

    <!-- fine dot texture -->
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect x="22" y="22" width="2" height="2" fill="#8fa3bb" opacity="0.18"/>
    </pattern>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Ambient light, centered so it reads well cropped on mobile -->
  <ellipse cx="960" cy="420" rx="720" ry="480" fill="url(#glowPrimary)" filter="url(#softBlur)"/>
  <ellipse cx="1180" cy="760" rx="420" ry="300" fill="url(#glowHighlight)" filter="url(#softBlur)"/>

  <!-- Faint dot texture across whole canvas -->
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- Thin diagonal grid lines (very subtle, full-bleed so they aren't corner-only) -->
  <g stroke="#26384f" stroke-width="1" opacity="0.35">
    <line x1="-200" y1="1080" x2="1000" y2="-200" />
    <line x1="-40" y1="1080" x2="1160" y2="-200" />
    <line x1="120" y1="1080" x2="1320" y2="-200" />
    <line x1="280" y1="1080" x2="1480" y2="-200" />
    <line x1="440" y1="1080" x2="1640" y2="-200" />
    <line x1="600" y1="1080" x2="1800" y2="-200" />
    <line x1="760" y1="1080" x2="1960" y2="-200" />
    <line x1="920" y1="1080" x2="2120" y2="-200" />
  </g>

  <!-- Circuit-style accent traces running through the CENTER band, not just edges -->
  <g fill="none" stroke="#38bdf8" stroke-linecap="round" filter="url(#lineGlow)">
    <path d="M 300 900 L 620 900 L 760 760 L 1060 760" stroke-width="1.6" opacity="0.4"/>
    <path d="M 900 1080 L 900 840 L 1120 620 L 1450 620" stroke-width="1.6" opacity="0.3"/>
    <path d="M 1550 200 L 1300 200 L 1180 320 L 900 320" stroke-width="1.6" opacity="0.35"/>
    <path d="M 620 200 L 620 380 L 480 520" stroke-width="1.4" opacity="0.25"/>
  </g>

  <!-- Node markers at trace joints (squares, not circles) -->
  <g fill="#38bdf8" filter="url(#lineGlow)">
    <rect x="616" y="896" width="8" height="8" transform="rotate(45 620 900)" opacity="0.7"/>
    <rect x="756" y="756" width="7" height="7" transform="rotate(45 760 760)" opacity="0.6"/>
    <rect x="1056" y="756" width="6" height="6" transform="rotate(45 1060 760)" opacity="0.5"/>
    <rect x="1116" y="616" width="7" height="7" transform="rotate(45 1120 620)" opacity="0.55"/>
    <rect x="1446" y="616" width="6" height="6" transform="rotate(45 1450 620)" opacity="0.4"/>
    <rect x="1176" y="316" width="7" height="7" transform="rotate(45 1180 320)" opacity="0.55"/>
    <rect x="476" y="516" width="6" height="6" transform="rotate(45 480 520)" opacity="0.45"/>
  </g>

  <!-- A couple of small highlight-colored nodes for warmth -->
  <g fill="#f5b942" filter="url(#lineGlow)">
    <rect x="1116" y="756" width="5" height="5" transform="rotate(45 1119 759)" opacity="0.5"/>
    <rect x="756" y="316" width="5" height="5" transform="rotate(45 759 319)" opacity="0.4"/>
  </g>

  <!-- Thin horizontal measure-lines for a "blueprint" feel, centered vertically -->
  <g stroke="#8fa3bb" stroke-width="1" opacity="0.12">
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="420" x2="1920" y2="420"/>
    <line x1="0" y1="660" x2="1920" y2="660"/>
  </g>

  <!-- Vignette on top -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
